plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.networkrecovery'
version = '0.0.1'

android {
  namespace 'expo.modules.networkrecovery'
  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
}

dependencies {
  compileOnly 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
