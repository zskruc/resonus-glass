plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.silencetrim'
version = '0.0.1'

android {
  namespace 'expo.modules.silencetrim'
  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
}

dependencies {
  // Reuse the already shipped ALAC decoder; no additional native library.
  implementation project(':alac-decoder')
  // Same Media3 version already bundled by expo-audio and the ALAC decoder.
  implementation 'androidx.media3:media3-extractor:1.9.0'
}
